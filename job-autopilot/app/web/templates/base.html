<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Job Autopilot{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between">
                <div class="flex space-x-7">
                    <div>
                        <a href="/" class="flex items-center py-4 px-2">
                            <span class="font-semibold text-gray-500 text-lg">Job Autopilot</span>
                        </a>
                    </div>
                    <div class="hidden md:flex items-center space-x-1">
                        <a href="/" class="py-4 px-2 text-blue-500 border-b-2 border-blue-500 font-semibold">Dashboard</a>
                        <a href="/sources/" class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-500 transition duration-300">Sources</a>
                        <a href="/filters/" class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-500 transition duration-300">Filters</a>
                        <a href="/profile/" class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-500 transition duration-300">Profile</a>
                        <a href="/vacancies/" class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-500 transition duration-300">Vacancies</a>
                        <a href="/applications/" class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-500 transition duration-300">Applications</a>
                        <a href="/contacts/" class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-500 transition duration-300">Contacts</a>
                        <a href="/outreach/" class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-500 transition duration-300">Outreach</a>
                        <a href="/stats/" class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-500 transition duration-300">Stats</a>
                        <a href="/settings/" class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-500 transition duration-300">Settings</a>
                        <a href="/logs/" class="py-4 px-2 text-gray-500 font-semibold hover:text-blue-500 transition duration-300">Logs</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
