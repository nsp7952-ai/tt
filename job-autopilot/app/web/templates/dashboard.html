{% extends "base.html" %}

{% block title %}Dashboard - Job Autopilot{% endblock %}

{% block content %}
<div class="px-4 py-8" x-data="dashboardApp()">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Dashboard</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0 bg-blue-500 rounded-md p-3">
                        <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Total Vacancies</dt>
                            <dd class="text-2xl font-semibold text-gray-900" x-text="stats.total_vacancies">0</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0 bg-green-500 rounded-md p-3">
                        <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Applications Sent</dt>
                            <dd class="text-2xl font-semibold text-gray-900" x-text="stats.applications_sent">0</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0 bg-purple-500 rounded-md p-3">
                        <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                        </svg>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Contacts Found</dt>
                            <dd class="text-2xl font-semibold text-gray-900" x-text="stats.contacts_found">0</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white overflow-hidden shadow rounded-lg">
            <div class="p-5">
                <div class="flex items-center">
                    <div class="flex-shrink-0 bg-yellow-500 rounded-md p-3">
                        <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                        </svg>
                    </div>
                    <div class="ml-5 w-0 flex-1">
                        <dl>
                            <dt class="text-sm font-medium text-gray-500 truncate">Outreach Messages</dt>
                            <dd class="text-2xl font-semibold text-gray-900" x-text="stats.outreach_messages">0</dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg mb-6">
        <div class="px-4 py-5 sm:p-6">
            <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">Quick Actions</h3>
            <div class="flex space-x-4">
                <button @click="fetchVacancies()" :disabled="loading" class="bg-blue-500 hover:bg-blue-600 disabled:bg-gray-400 text-white font-semibold py-2 px-4 rounded">
                    <span x-show="!loading">Fetch Vacancies Now</span>
                    <span x-show="loading">Loading...</span>
                </button>
                <button @click="runTelegramMonitor()" :disabled="loading" class="bg-green-500 hover:bg-green-600 disabled:bg-gray-400 text-white font-semibold py-2 px-4 rounded">
                    Run Telegram Monitor
                </button>
                <button @click="generateSummary()" :disabled="loading" class="bg-purple-500 hover:bg-purple-600 disabled:bg-gray-400 text-white font-semibold py-2 px-4 rounded">
                    Generate Summary
                </button>
            </div>
        </div>
    </div>

    <div class="bg-white shadow rounded-lg">
        <div class="px-4 py-5 sm:p-6">
            <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">Recent Activity</h3>
            <div class="space-y-3">
                <template x-for="event in recentEvents" :key="event.id">
                    <div class="flex items-start space-x-3 pb-3 border-b">
                        <div class="flex-shrink-0">
                            <span class="inline-block h-2 w-2 rounded-full" :class="{
                                'bg-blue-500': event.event_type === 'vacancy',
                                'bg-green-500': event.event_type === 'application',
                                'bg-purple-500': event.event_type === 'contact',
                                'bg-yellow-500': event.event_type === 'outreach'
                            }"></span>
                        </div>
                        <div class="flex-1">
                            <p class="text-sm text-gray-900" x-text="event.message"></p>
                            <p class="text-xs text-gray-500" x-text="formatDate(event.created_at)"></p>
                        </div>
                    </div>
                </template>
                <template x-if="recentEvents.length === 0">
                    <div class="text-gray-500 text-sm">
                        No recent activity yet. Start by configuring sources and filters.
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
function dashboardApp() {
    return {
        stats: {
            total_vacancies: 0,
            applications_sent: 0,
            contacts_found: 0,
            outreach_messages: 0
        },
        recentEvents: [],
        loading: false,
        
        init() {
            this.loadStats();
            this.loadRecentEvents();
        },
        
        loadStats() {
            fetch('/api/stats/summary')
                .then(r => r.json())
                .then(data => {
                    if (data) {
                        this.stats = data;
                    }
                });
        },
        
        loadRecentEvents() {
            fetch('/api/events?limit=10')
                .then(r => r.json())
                .then(data => {
                    this.recentEvents = data || [];
                });
        },
        
        formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleString();
        },
        
        fetchVacancies() {
            this.loading = true;
            fetch('/api/sources/fetch', {method: 'POST'})
                .then(() => {
                    this.loadStats();
                    this.loadRecentEvents();
                })
                .finally(() => {
                    this.loading = false;
                });
        },
        
        runTelegramMonitor() {
            this.loading = true;
            fetch('/api/telegram/monitor', {method: 'POST'})
                .then(() => {
                    this.loadStats();
                    this.loadRecentEvents();
                })
                .finally(() => {
                    this.loading = false;
                });
        },
        
        generateSummary() {
            alert('Summary generation will be available soon.');
        }
    }
}
</script>
{% endblock %}
