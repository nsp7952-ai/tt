{% extends "base.html" %}
{% block title %}Filters - Job Autopilot{% endblock %}
{% block content %}
<div class="px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Filters</h1>
    <div class="bg-white shadow rounded-lg p-6">
        <h2 class="text-xl font-semibold mb-4">Global Filter</h2>
        <p class="text-gray-600 mb-4">Configure your global job filtering rules here.</p>
        <textarea class="w-full h-64 p-4 border rounded-lg font-mono text-sm" placeholder='{"positions": ["golang", "backend"], "remote_only": true, "min_grade": "middle"}'></textarea>
        <button class="mt-4 bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded">Save Filter</button>
    </div>
</div>
{% endblock %}
