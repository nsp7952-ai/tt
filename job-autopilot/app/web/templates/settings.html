{% extends "base.html" %}
{% block title %}Settings - Job Autopilot{% endblock %}
{% block content %}
<div class="px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Settings</h1>
    <div class="bg-white shadow rounded-lg p-6 space-y-6">
        <div>
            <h2 class="text-xl font-semibold mb-4">LLM Configuration</h2>
            <div class="space-y-4">
                <input type="text" placeholder="API Key" class="w-full p-2 border rounded-md">
                <input type="text" placeholder="Base URL" class="w-full p-2 border rounded-md" value="https://api.openai.com/v1">
                <input type="text" placeholder="Model" class="w-full p-2 border rounded-md" value="gpt-4o">
            </div>
        </div>
        <div>
            <h2 class="text-xl font-semibold mb-4">Telegram Configuration</h2>
            <div class="space-y-4">
                <input type="text" placeholder="API ID" class="w-full p-2 border rounded-md">
                <input type="text" placeholder="API Hash" class="w-full p-2 border rounded-md">
                <input type="text" placeholder="Bot Token" class="w-full p-2 border rounded-md">
                <input type="text" placeholder="Chat ID" class="w-full p-2 border rounded-md">
            </div>
        </div>
        <div>
            <h2 class="text-xl font-semibold mb-4">Scheduler</h2>
            <div class="space-y-4">
                <label class="flex items-center space-x-2">
                    <input type="number" class="w-24 p-2 border rounded-md" value="30">
                    <span>Vacancy fetch interval (minutes)</span>
                </label>
                <label class="flex items-center space-x-2">
                    <input type="number" class="w-24 p-2 border rounded-md" value="5">
                    <span>Telegram monitor interval (minutes)</span>
                </label>
            </div>
        </div>
        <button class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded">Save Settings</button>
    </div>
</div>
{% endblock %}
