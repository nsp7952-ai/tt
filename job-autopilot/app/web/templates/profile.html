{% extends "base.html" %}
{% block title %}Profile - Job Autopilot{% endblock %}
{% block content %}
<div class="px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Profile Context</h1>
    <div class="bg-white shadow rounded-lg p-6">
        <form class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Name</label>
                <input type="text" class="mt-1 w-full p-2 border rounded-md" value="{{ profile.name if profile else '' }}">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Markdown Bio</label>
                <textarea class="mt-1 w-full h-48 p-2 border rounded-md font-mono text-sm" placeholder="Your professional bio...">{{ profile.markdown_text if profile else '' }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Tone</label>
                <select class="mt-1 w-full p-2 border rounded-md">
                    <option value="professional" {{ 'selected' if profile and profile.tone == 'professional' else '' }}>Professional</option>
                    <option value="friendly" {{ 'selected' if profile and profile.tone == 'friendly' else '' }}>Friendly</option>
                    <option value="casual" {{ 'selected' if profile and profile.tone == 'casual' else '' }}>Casual</option>
                </select>
            </div>
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded">Save Profile</button>
        </form>
    </div>
</div>
{% endblock %}
